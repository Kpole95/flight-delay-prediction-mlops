[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "xgboost>=3.4.1",
]

[project.scripts]
flight-delay = "flight_delay_prediction.commands:main"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_delay_prediction*"]
exclude = ["tests*"]
