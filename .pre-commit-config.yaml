repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        types: [python]
        args: [--fix]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/mirrors-prettier/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
